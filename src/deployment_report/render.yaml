services:
  - type: web
    name: cairo-pm25-api
    runtime: python
    rootDir: task3_api_bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FORECASTS_PATH
        value: data/forecasts.csv
      - key: ALERT_CONFIG_PATH
        value: alert_config.json
      - key: MAX_AGE_DAYS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: cron
    name: cairo-pm25-daily-pipeline
    runtime: python
    rootDir: task1_pipeline
    schedule: "0 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python pipeline/run_forecast.py
