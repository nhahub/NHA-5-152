services:
  - type: web
    name: cairo-pm25-api
    runtime: python
    plan: free
    buildCommand: pip install -r src/api_bot/requirements.txt
    startCommand: cd src/api_bot && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FORECASTS_PATH
        value: ../pipeline/forecasts.csv
      - key: ALERT_CONFIG_PATH
        value: alert_config.json
      - key: MAX_AGE_DAYS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
