name: Daily Cairo PM2.5 Forecast Pipeline

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-forecast-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          pip install --upgrade pip
          pip install -r task1_pipeline/requirements.txt

      - name: Run daily forecast pipeline
        working-directory: task1_pipeline
        run: python pipeline/run_forecast.py

      - name: Sync forecasts.csv to API and Dashboard folders
        run: |
          mkdir -p task3_api_bot/data
          cp task1_pipeline/forecasts.csv task3_api_bot/data/forecasts.csv
          cp task1_pipeline/forecasts.csv task4_dashboard/forecasts.csv

      - name: Commit and push updated forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add task1_pipeline/forecasts.csv task1_pipeline/forecast_log.csv task3_api_bot/data/forecasts.csv task4_dashboard/forecasts.csv
          git diff --cached --quiet || git commit -m "chore: update daily PM2.5 forecasts"
          git push
